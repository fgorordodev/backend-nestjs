name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.1

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Check Dockerfile
        run: docker build --check .

      - name: Build production image
        run: docker build --tag backend-base:ci .

      - name: Start hardened container
        run: |
          docker run \
            --detach \
            --name backend-base-ci \
            --publish 3000:3000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            backend-base:ci

      - name: Wait for healthy container
        run: |
          for attempt in {1..40}; do
            running="$(
              docker inspect \
                --format '{{.State.Running}}' \
                backend-base-ci
            )"

            if [ "$running" != "true" ]; then
              docker logs backend-base-ci
              exit 1
            fi

            status="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                backend-base-ci
            )"

            if [ "$status" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs backend-base-ci
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time"
          docker logs backend-base-ci
          exit 1

      - name: Show container logs
        if: always()
        run: |
          if docker inspect backend-base-ci >/dev/null 2>&1; then
            docker logs backend-base-ci
          fi

      - name: Remove container
        if: always()
        run: docker rm --force backend-base-ci || true  