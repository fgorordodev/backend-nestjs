name: backend-base

services:
  api:
    build:
      context: .
      target: runtime

    image: backend-base:${APP_VERSION:-local}

    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production

    ports:
      - '${HOST_PORT:-3000}:${PORT:-3000}'

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'